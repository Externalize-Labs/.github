name: Bug
description: Something verifies that shouldn't, fails that shouldn't, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "A proof that verifies but shouldn't is a security issue: report it privately (Security tab of the repository), not here."
  - type: dropdown
    id: repo
    attributes:
      label: Component
      options: [externalize (verifier, CLI, WASM), externalize-node (exnode)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command or code, input (bundle, ledger, tx hash), and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: externalize --version, or exnode version
